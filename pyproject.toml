[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-file-manager"
version = "0.1.0"
description = "A two-pane local Docker file manager for Linux"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "docker>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
docker-file-manager = "docker_file_manager.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

